<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Banterbird</title>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <h1 class = "colorPgTools" >Banterbird</h1>
    <div>
        Logged in as: <strong id="username">anonymous</strong>
    </div>
    <div>
        <h3 ID = "ID1CA">New Post</h3>
        <textarea id="postInput" placeholder="What's on your mind?"></textarea><br>
        <button onclick="submitPost()">Tweet</button>
    </div>
    <hr>
    <h3>Feed</h3>
    <div id="feed"></div>

    <template id="post-template" class = "font">
        <div class="post">
            <p><strong class="username"></strong>: <span class="message"></span></p>
            <small class="timestamp"></small>
            <hr>
        </div>
    </template>
    <script>
        document.getElementById("username").innerText = 
            localStorage.getItem("username");
    </script>
</body>
</html>
